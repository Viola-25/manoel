name: Gerar dados e publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extrair exames dos PDFs (se houver)
        run: |
          if ls raw/*.pdf >/dev/null 2>&1; then
            python scripts/extract_exams.py
          else
            echo "Nenhum PDF nesta versao; mantendo data/ ja commitado."
          fi

      - name: Validar dados
        run: python scripts/check_data.py

      - name: Preparar site (public/ + dados)
        run: |
          mkdir -p _site/data
          cp -r public/* _site/
          cp -r data/*.json _site/data/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
