name: Gerar dados e publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pymupdf

      - name: Extrair exames dos PDFs (se houver)
        run: |
          if ls examesbruto/*.pdf >/dev/null 2>&1; then
            python scripts/extract_exams.py
          else
            echo "Nenhum PDF nesta versao; mantendo data/ ja commitado."
          fi

      - name: Preparar site (somente index + dados)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r data/*.json _site/data/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
